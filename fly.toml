app = "mi-club-tesis"
primary_region = "gru"

[env]
  APP_ENV = "production"
  APP_DEBUG = "false"
  APP_URL = "https://mi-club-tesis.fly.dev"
  LOG_CHANNEL = "stderr"
  DB_CONNECTION = "pgsql"
  DB_DATABASE = "gestion_club"
  SESSION_DRIVER = "file"
  CACHE_STORE = "file"
  QUEUE_CONNECTION = "sync"

[build]
  dockerfile = "Dockerfile.fly"

[http_service]
  internal_port = 80
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory = "1gb"
